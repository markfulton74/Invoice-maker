<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoices</title>
<style>
:root{--g:#1f5c45;--bg:#f8f3e8;--c:#fffdf7;--b:#d9d0b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:17px/1.5 system-ui,sans-serif;color:#2b2a24}
nav{background:var(--c);border-bottom:1px solid var(--b);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0}
button,input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;min-height:46px}
button{cursor:pointer;background:var(--c)}button.p{background:var(--g);color:#fff;border-color:var(--g)}button.on{background:#dcebe2;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}
label{display:flex;flex-direction:column;font-weight:600;font-size:.9rem;gap:4px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}.r{text-align:right}
.li{cursor:pointer}.li:hover{background:#efe8d6}
.tag{padding:2px 10px;border-radius:99px;font-size:.85rem;background:#e6dec8;white-space:nowrap}.Paid{background:#cfe8d8}.Part{background:#f3e0b0}.Overdue{background:#f1c9c0}
h1,h2{font-family:Georgia,serif;margin:.3em 0}pre{white-space:pre-wrap;font:inherit;margin:0}small{color:#6b6759}
@media print{nav,.np{display:none}body{background:#fff}.card{border:0}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),KEY='invoices-data';
const blank={settings:{name:'',address:'',phone:'',email:'',bank:'',vatOn:false,vat:15,prefix:'INV-',next:1,sym:'R',days:30,foot:'Thank you for your business.'},clients:[],products:[],invoices:[]};
let D=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(blank),V='list',F={},fh=null;
const today=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return today(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=n=>Math.round(n*100)/100,m=n=>D.settings.sym+r2(+n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const tot=i=>{const s=r2(i.items.reduce((a,x)=>a+x.q*x.p,0)),v=r2(s*i.vat/100);return{s,v,t:r2(s+v)}};
const paid=i=>r2(i.pays.reduce((a,p)=>a+p.a,0)),bal=i=>Math.max(0,r2(tot(i).t-paid(i)));
const st=i=>bal(i)<=0?'Paid':paid(i)>0?'Part paid':i.due<today()?'Overdue':'Unpaid';
const tg=i=>`<span class="tag ${st(i).split(' ')[0]}">${st(i)}</span>`;
const get=p=>p.split('.').reduce((o,k)=>o?.[k],F);
const set=(p,v,n)=>{const a=p.split('.');a.reduce((o,k,i)=>i<a.length-1?o[k]:(o[k]=n?parseFloat(v)||0:v,o),F)};
const fld=(l,p,t='text')=>`<label>${l}`+(t=='area'?`<textarea rows=3 onchange="set('${p}',this.value)">${esc(get(p))}</textarea>`:`<input type=${t} value="${esc(get(p))}" ${t=='number'?'step=any inputmode=decimal':''} onchange="set('${p}',this.value,${t=='number'})">`)+`</label>`;
async function save(){localStorage.setItem(KEY,JSON.stringify(D));if(fh)try{const w=await fh.createWritable();await w.write(JSON.stringify(D,null,2));await w.close()}catch(e){alert('Could not save to the file: '+e.message)}}
async function openFile(){try{if(window.showOpenFilePicker){[fh]=await showOpenFilePicker({types:[{accept:{'application/json':['.json']}}]});load(await(await fh.getFile()).text())}else $('#up').click()}catch(e){}}
function load(t){try{const d=JSON.parse(t);if(!d.invoices)throw 0;D=d;save();go('list')}catch{alert("That file isn't an invoices file")}}
async function saveFile(){try{if(!fh&&window.showSaveFilePicker)fh=await showSaveFilePicker({suggestedName:'invoices.json',types:[{accept:{'application/json':['.json']}}]});if(fh){await save();render()}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='invoices-'+today()+'.json';a.click()}}catch(e){}}
function go(v,a){V=v;F=a||{};render();scrollTo(0,0)}
function render(){$('#app').innerHTML=`<nav>${[['list','Invoices'],['edit','New invoice'],['clients','Clients'],['products','Products'],['settings','Settings']].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}<span style="flex:1"></span><small>${fh?'Saving to '+esc(fh.name):'Saved in this browser only'}</small><button onclick="openFile()">Open file</button><button class=p onclick="saveFile()">Save to file</button><input id=up type=file accept=".json" hidden onchange="this.files[0].text().then(load)"></nav><main>${views[V]()}</main>`;if($('#tt'))calc()}
function listRows(){const q=(F.q||'').toLowerCase(),f=F.f||'all';
 const L=D.invoices.filter(i=>[i.no,i.c.name,i.c.company,i.date,tot(i).t.toFixed(2),i.notes,...i.items.map(x=>x.d)].join(' ').toLowerCase().includes(q)&&(f=='all'||(f=='paid'?bal(i)<=0:bal(i)>0))&&(!F.from||i.date>=F.from)&&(!F.to||i.date<=F.to)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 if(f=='owed'){const g={};L.forEach(i=>g[i.c.name]=r2((g[i.c.name]||0)+bal(i)));return `<table>${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td class=r><b>${m(v)}</b></td></tr>`).join('')||'<tr><td>Nobody owes you anything.</td></tr>'}</table>`}
 return `<small>${L.length} invoices · total ${m(L.reduce((a,i)=>a+tot(i).t,0))} · still owed ${m(L.reduce((a,i)=>a+bal(i),0))}</small><table>${L.map(i=>`<tr class=li onclick="go('view',{id:${i.id}})"><td><b>${esc(i.no)}</b><br><small>${esc(i.c.name)}</small></td><td>${i.date}</td><td class=r>${m(tot(i).t)}</td><td>${tg(i)}</td></tr>`).join('')||'<tr><td>No invoices found.</td></tr>'}</table>`}
const views={
list(){const f=F.f||'all';return `<h1>Invoices</h1><div class=card><input style="width:100%" placeholder="Search by client, product, invoice number, date or amount…" value="${esc(F.q||'')}" oninput="F.q=this.value;$('#res').innerHTML=listRows()"><p>${[['all','Everything'],['unpaid','Not paid yet'],['paid','Paid'],['owed','Who still owes me?']].map(([k,l])=>`<button class="${f==k?'on':''}" onclick="F.f='${k}';render()">${l}</button>`).join(' ')}</p><div class=row><label>From<input type=date value="${F.from||''}" onchange="F.from=this.value;render()"></label><label>To<input type=date value="${F.to||''}" onchange="F.to=this.value;render()"></label></div></div><div class=card id=res>${listRows()}</div>`},
edit(){const S=D.settings,I=F.inv||(F.inv={cid:'',date:today(),due:addDays(today(),S.days),notes:'',vat:S.vatOn?S.vat:0,items:[{d:'',q:1,p:0}],pays:[]});
 return `<h1>${I.id?'Change '+esc(I.no):'New invoice'}</h1><div class=card><div class=row><label>Client<select onchange="pickC(this.value)"><option value="">Choose…</option>${D.clients.map(c=>`<option value=${c.id} ${c.id==I.cid?'selected':''}>${esc(c.name)}</option>`).join('')}<option value=new>＋ Add a new client</option></select></label>${fld('Invoice date','inv.date','date')}${fld('Due date','inv.due','date')}</div></div><div class=card><h2>What did you sell?</h2>${I.items.map((x,n)=>`<div class=row style="margin-bottom:10px"><label>Product<select onchange="pickP(${n},this.value)"><option value="">Pick…</option>${D.products.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}<option value=new>＋ Add a new product</option></select></label>${fld('Description','inv.items.'+n+'.d')}${fld('How many','inv.items.'+n+'.q','number')}${fld('Price each','inv.items.'+n+'.p','number')}<button style="flex:0" onclick="F.inv.items.splice(${n},1);if(!F.inv.items.length)F.inv.items.push({d:'',q:1,p:0});render()">✕</button></div>`).join('')}<button onclick="F.inv.items.push({d:'',q:1,p:0});render()">＋ Add another product</button></div><div class=card>${fld('Note for the client (optional)','inv.notes')}${S.vatOn?`<p><label style="flex-direction:row;align-items:center;gap:8px"><input type=checkbox style="min-height:0" ${I.vat?'checked':''} onchange="F.inv.vat=this.checked?D.settings.vat:0;calc()"> Add VAT (${S.vat}%)</label></p>`:''}<h2 id=tt></h2><button class=p onclick="saveInv()">Save invoice</button> <button onclick="go('list')">Cancel</button></div>`},
view(){const i=D.invoices.find(x=>x.id==F.id);if(!i)return'<p>Not found</p>';const S=D.settings,t=tot(i);
 return `<div class=np><button onclick="go('list')">← All invoices</button> ${bal(i)>0?`<button class=p onclick="pay(${i.id})">Record a payment</button>`:''} <button onclick="print()">Print / save as PDF</button> <button onclick="go('edit',{inv:structuredClone(D.invoices.find(x=>x.id==${i.id}))})">Change</button> <button onclick="del(${i.id})">Delete</button> ${tg(i)}</div><div class=card><h1>${esc(S.name)}</h1><pre>${esc(S.address)}\n${esc(S.phone)} ${esc(S.email)}</pre><h2>${S.vatOn?'TAX INVOICE':'INVOICE'} ${esc(i.no)}</h2><p>Date: ${i.date} · Due: ${i.due}</p><p><b>Billed to</b></p><pre>${esc(i.c.name+'\n'+i.c.company+'\n'+i.c.address)}</pre><table style="margin-top:12px"><tr><th>Description</th><th class=r>Qty</th><th class=r>Price</th><th class=r>Amount</th></tr>${i.items.map(x=>`<tr><td>${esc(x.d)}</td><td class=r>${x.q}</td><td class=r>${m(x.p)}</td><td class=r>${m(x.q*x.p)}</td></tr>`).join('')}</table><p class=r>Subtotal ${m(t.s)}<br>${i.vat?`VAT (${i.vat}%) ${m(t.v)}<br>`:''}<b style="font-size:1.3rem">Total ${m(t.t)}</b>${paid(i)?`<br>Paid ${m(paid(i))}<br><b>Balance due ${m(bal(i))}</b>`:''}</p>${i.notes?`<p>${esc(i.notes)}</p>`:''}<hr><b>How to pay</b><pre>${esc(S.bank)}\nPlease use ${esc(i.no)} as the reference.</pre><p style="text-align:center"><small>${esc(S.foot)}</small></p></div>${i.pays.length?`<div class="card np"><h2>Payments received</h2>${i.pays.map((p,n)=>`<p>${m(p.a)} on ${p.on} <button onclick="if(confirm('Remove this payment?')){D.invoices.find(x=>x.id==${i.id}).pays.splice(${n},1);save();render()}">Remove</button></p>`).join('')}</div>`:''}`},
clients(){return crud('clients','Clients',[['Name','name'],['Company','company'],['Phone','phone'],['Email','email'],['Address','address','area']],{id:0,name:'',company:'',phone:'',email:'',address:''})},
products(){return crud('products','Products',[['Product name','name'],['Usual price','price','number']],{id:0,name:'',price:0})},
settings(){const s=F.s||(F.s=structuredClone(D.settings));return `<h1>Settings</h1><div class=card><div class=row>${fld('Business name','s.name')}${fld('Phone','s.phone')}${fld('Email','s.email')}</div><div class=row>${fld('Address','s.address','area')}${fld('Banking details','s.bank','area')}</div></div><div class=card><label style="flex-direction:row;align-items:center;gap:8px"><input type=checkbox style="min-height:0" ${s.vatOn?'checked':''} onchange="F.s.vatOn=this.checked"> I am registered for VAT</label><div class=row>${fld('VAT rate (%)','s.vat','number')}${fld('Invoice number starts with','s.prefix')}${fld('Next invoice number','s.next','number')}${fld('Money symbol','s.sym')}${fld('Usual days to pay','s.days','number')}${fld('Footer message','s.foot')}</div></div><button class=p onclick="D.settings=F.s;save();go('list')">Save settings</button>`}};
function crud(k,title,fs,bl){const e=F.e;return `<h1>${title}</h1>`+(e?`<div class=card><div class=row>${fs.map(([l,key,t])=>fld(l,'e.'+key,t)).join('')}</div><p><button class=p onclick="saveE('${k}')">Save</button> <button onclick="go('${k}')">Cancel</button></p></div>`:`<p><button class=p onclick='go("${k}",{e:${JSON.stringify(bl)}})'>＋ Add</button></p>`)+`<div class=card><table>${D[k].map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.company||x.price||'')}</small></td><td class=r><button onclick="go('${k}',{e:structuredClone(D.${k}.find(y=>y.id==${x.id}))})">Change</button> <button onclick="if(confirm('Delete ${esc(x.name).replace(/'/g,'')}? Old invoices are not affected.')){D.${k}=D.${k}.filter(y=>y.id!=${x.id});save();render()}">Delete</button></td></tr>`).join('')||'<tr><td>Nothing here yet.</td></tr>'}</table></div>`}
function saveE(k){const e=F.e;if(!e.name.trim())return alert('Please enter a name');if(!e.id){e.id=Date.now();D[k].push(e)}else D[k][D[k].findIndex(y=>y.id==e.id)]=e;save();go(k)}
function calc(){const t=tot(F.inv);$('#tt').textContent='Total '+m(t.t)+(F.inv.vat?' (VAT '+m(t.v)+')':'')}
function pickC(v){if(v=='new'){const n=prompt('Client name?');if(n){const c={id:Date.now(),name:n,company:'',phone:'',email:'',address:''};D.clients.push(c);F.inv.cid=c.id;save()}}else F.inv.cid=+v;render()}
function pickP(n,v){let p;if(v=='new'){const nm=prompt('Product name?');if(!nm)return render();p={id:Date.now(),name:nm,price:parseFloat(prompt('Usual price?','0'))||0};D.products.push(p);save()}else p=D.products.find(x=>x.id==v);if(p)Object.assign(F.inv.items[n],{d:p.name,p:p.price});render()}
function saveInv(){const I=F.inv,c=D.clients.find(c=>c.id==I.cid);if(!c)return alert('Please choose a client');I.items=I.items.filter(x=>x.d||x.p);if(!I.items.length)return alert('Please add at least one product');if(I.items.some(x=>!x.d||!(x.q>0)))return alert('Each line needs a description and a quantity');I.c={...c};if(!I.id){I.id=Date.now();I.no=D.settings.prefix+String(D.settings.next++).padStart(4,'0');D.invoices.push(I)}else D.invoices[D.invoices.findIndex(i=>i.id==I.id)]=I;save();go('view',{id:I.id})}
function pay(id){const i=D.invoices.find(x=>x.id==id),a=parseFloat(prompt('How much was paid?',bal(i)));if(!(a>0))return;if(a>bal(i)+.004)return alert('That is more than is owed');i.pays.push({a,on:today()});save();render()}
function del(id){if(confirm('Delete this invoice for good?')){D.invoices=D.invoices.filter(i=>i.id!=id);save();go('list')}}
render();
</script></body></html>
